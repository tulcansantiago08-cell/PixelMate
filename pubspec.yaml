name: pixelmate
description: Mascota virtual inteligente para macOS con Claude AI integrado.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado global
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Base de datos local
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^3.5.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # HTTP / Claude API
  http: ^1.2.1
  dio: ^5.4.3

  # Ventana nativa macOS
  window_manager: ^0.3.9
  screen_retriever: ^0.1.9

  # Utilidades
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.3.1
  tray_manager: ^0.5.2
  flutter_local_notifications: ^23.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/idle/
    - assets/sprites/walk/
    - assets/sprites/work/
    - assets/sprites/sleep/
    - assets/sprites/celebrate/
    - assets/tray/
